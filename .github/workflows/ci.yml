# CI（2026-10-24 交付评审 P1-4：入库 ruff 配置与 CI）
#
# 为什么有这份文件：仓库原先没有 CI，质量门只存在于作者本地（.ruff_cache
# 有痕迹、规则却没进版本库）⇒ "按文档从零安装"的贡献者无法复现同一个门。
# 本工作流把门禁固化成两个 job：
#   backend  —— py3.12 + requirements(+dev) → ruff 门 → pytest
#   frontend —— node 22 + npm ci → tsc -b && vitest run
#
# 与本地的一致性约定（改了 CI 行为必须同步改文档，反之亦然）：
#   * ruff 规则唯一来源是仓库根 ruff.toml（含逐条 ignore 理由），本文件不重复配置
#   * pytest 从 backend/ 目录跑；OPENBLAS_NUM_THREADS=1 是 CP-SAT/numpy 在
#     Linux runner 上的既定环境（本地 Windows 同约定，见 README 测试节）
#   * 干净检出不含 schedule.xlsx（.gitignore 第 35 行）⇒ 真实表用例 skip、
#     其余全过：CI 期望形态是「passed + skipped，零 failed」

name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend (ruff + pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt -r backend/requirements-dev.txt

      - name: Import smoke test (python-multipart 在场)
        # P0-1 回归：缺 python-multipart 时 import app.main 直接 RuntimeError，
        # 服务起不来。安装步漏依赖时在这里炸，而不是等到跑测试才莫名红一片。
        # 数 OpenAPI 路径而非 app.routes：本版本 FastAPI 的 include_router 在
        # app.routes 里是懒加载对象（实测只有 8 条），openapi 路径数才是真实端点面。
        run: |
          python -c "import sys; sys.path.insert(0, 'backend'); from app.main import app; n = len(app.openapi()['paths']); assert n >= 40, f'routes dropped: {n}'; print(f'import smoke OK: {n} endpoints')"

      - name: Ruff lint gate
        run: ruff check --config ruff.toml .

      - name: Event-loop blocking audit
        # 2026-10-29 加：这是"重活跑在事件循环上"的静态判据（R-81/R-84 各抓到一处：
        # `_ensure_loaded` 整表解析、`get_teacher_roles` 开工作簿、`parse_request` 打 LLM）。
        # 它**不需要起服务**，纯 AST 分析，0.2s —— 是最便宜的一道门，却没进过 CI。
        #
        # 判据分三档（脚本内注释有完整理由）：
        #   · suspicious（重活在事件循环上）**必须为 0**，除非在 KNOWN_BLOCKING 里
        #     且带实测数字（当前只有 `/upload`，附 343ms + 44ms 空窗的说明）；
        #   · 零 await 的轻查询（13 个，1–5ms）与基线快照比对，**只拦新增**；
        #   · 基线变化需 `--update-baseline` 显式更新并提交，评审能看见。
        run: python scripts/audit_async_blocking.py backend/app/api/reschedule.py

      - name: Pytest
        working-directory: backend
        env:
          OPENBLAS_NUM_THREADS: "1"
          PYTHONIOENCODING: utf-8
        run: python -m pytest tests/ -q

  frontend:
    name: frontend (tsc + vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Type check + unit tests
        working-directory: frontend
        run: npm run verify

  coverage:
    name: coverage (行覆盖率门槛)
    runs-on: ubuntu-latest
    # 为什么单独一个 job（2026-10-29）：项目铁律是"守卫必须敢红"（R-25），
    # 但没有覆盖率图时"这段代码从没被执行过"只能靠人想到去点 —— R-70 就是这样
    # 漏掉"主路径第 ③ 步零覆盖"的。R-81 补测 LLM 调用路径之前，
    # `llm_intent_parser.py` 只有 46.4%：`httpx` 之后那些行（真实解析/consult/候选方案）
    # 一行都没跑过，而它们恰恰最容易静默出错（空 choices、429、超时）。
    #
    # 用 `scripts/coverage_probe.py`（标准库 sys.monitoring，不引入 pytest-cov）：
    # 本轮实测 PyPI 镜像不可达，装不上 pytest-cov；而本项目要求"能复现"，
    # 所以宁可用 100 行自研探针，也不写一条跑不通的命令进文档。
    #
    # 分母口径是 **AST 枚举的可执行语句行**（fail-closed）：没被 import 的文件算 0%，
    # 不会因为"没被加载"而虚高 —— 这正是 R-25 那种"把没测伪装成测过"的反面。
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"      # sys.monitoring 需要 3.12+，探针里有显式守卫
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt -r backend/requirements-dev.txt

      - name: Coverage gate
        working-directory: backend
        env:
          OPENBLAS_NUM_THREADS: "1"
          PYTHONIOENCODING: utf-8
        # 门槛 80%：CI 干净检出（无 schedule.xlsx，真实表用例 skip）实测 87.7%，
        # 本地（有真实表）88.3%。留 7 个点余量 —— 门槛的作用是"拦住覆盖率断崖"，
        # 不是逼人为数字写测试。--fail-zero 才是硬要求：任何文件整份零覆盖即红。
        run: python ../scripts/coverage_probe.py --fail-under 80 --fail-zero --top 10

  ui-probes:
    name: ui probes (Playwright × 3)
    runs-on: ubuntu-latest
    # 为什么这个 job 拖到现在才有（2026-10-30，R-97）：
    # 探针一直"只能手动跑"，根因不是麻烦，而是**两条硬耦合**：
    #   ① `probe_ui_flow.cjs` 硬编码了 13 位真实教师姓名 ⇒ 只能在带真实表的机器上跑；
    #   ② CI 的干净检出**没有** `schedule.xlsx`（.gitignore 第 35 行），只有脱敏表。
    # 本轮把 ① 改成从 `/teachers` 接口取名字，实测脱敏表上 16/16、8/8、11/11 全过，
    # ② 就不再是障碍 —— `schedule.demo.xlsx` 与真实表**规模完全一致**
    # （433 条 / 17 班 / 16 周，只是姓名脱敏）。
    #
    # 只跑 3 个不依赖云端 OAuth 的探针；`probe_demo_path` / `probe_demo_rehearsal`
    # 需要微信扫码与云端回调域白名单，CI 上必然失败（本地也会，见探针内注释）。
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend deps
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt -r backend/requirements-dev.txt

      - name: Install frontend deps + Chromium
        working-directory: frontend
        run: |
          npm ci
          # playwright-core 不自带浏览器；版本必须与 package.json 的 1.64.1 对齐，
          # 否则 CDP 协议不匹配（`scripts/_browser.cjs` 里有自动发现的兜底，
          # 但显式指定更稳、报错更清楚）。
          npx playwright install --with-deps chromium

      - name: Build webui
        working-directory: frontend
        run: npx vite build

      - name: Start server (demo table, DEMO_MODE)
        env:
          OPENBLAS_NUM_THREADS: "1"
          DEMO_MODE: "1"
          ADMIN_PASS: admin123
          PORT: "8023"
          # 干净检出没有真实表；显式指到脱敏表，避免回退逻辑在不同环境走不同分支
          SCHEDULE_PATH: ${{ github.workspace }}/schedule.demo.xlsx
        run: |
          nohup python run.py > /tmp/server.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:8023/health > /dev/null; then
              echo "server up after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "server 未起来，日志："; tail -40 /tmp/server.log; exit 1

      - name: Warm up (load default table)
        run: |
          curl -sf -X POST http://127.0.0.1:8023/api/reschedule/load-default | head -c 200
          echo
          curl -sf http://127.0.0.1:8023/api/reschedule/teachers | head -c 160

      - name: Probe — 主流程 16 项
        working-directory: frontend
        env:
          SITE: http://127.0.0.1:8023/
        run: npm run probe

      - name: Probe — 故障注入 8 项
        working-directory: frontend
        env:
          SITE: http://127.0.0.1:8023/
          PROBE_TEACHER: 教师C          # 脱敏表里的第一个教师
        run: npm run probe:faults

      - name: Probe — 调课 11 项
        working-directory: frontend
        env:
          SITE: http://127.0.0.1:8023/
          PROBE_TEACHER: 教师C
        run: npm run probe:reschedule

      # 彩排探针（10 步、约 31s）：测的是"每一步有没有画面、要等多久"，
      # 与上面三个探针的"功能对不对"互补。
      # 前置必须 prepare_demo.py：它会 reset 演示态 + 造一条**已验证可落地**的工单；
      # 没有它，⑥「同意一条 → 课表落地」会干等超时（R-79 为此把探针改成 0.2s 快速失败）。
      - name: Prepare demo (reset + seeded ticket)
        env:
          # 脚本读的是 DEMO_BASE_URL（`scripts/prepare_demo.py` 第 18 行）；
          # 写成 BASE_URL 会被静默忽略，然后连到默认端口 —— CI 上恰好也是 8023，
          # 所以这个错误不会报错、只会在改端口时突然失效。
          DEMO_BASE_URL: http://127.0.0.1:8023
        run: python scripts/prepare_demo.py

      - name: Probe — 演示彩排 10 步
        working-directory: frontend
        env:
          SITE: http://127.0.0.1:8023/
        run: node ../scripts/probe_demo_rehearsal.cjs

      - name: Server log on failure
        if: failure()
        run: tail -80 /tmp/server.log
